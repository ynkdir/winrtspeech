[project]
name = "winrtspeech"
version = "0.0.1"
description = "Win32more demonstration to use WinRT speech API"
readme = "README.md"
authors = [
    { name = "Yukihiro Nakadaira", email = "yukihiro.nakadaira@gmail.com" }
]
requires-python = ">= 3.13"
dependencies = ["win32more"]

[project.scripts]
winrtspeech = "winrtspeech:main"

[build-system]
requires = ["uv_build>=0.8.20,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
lint.select = ["E4", "E7", "E9", "F", "I"]
